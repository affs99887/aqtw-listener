<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行商听音助手 · 界面设计册</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;background:#101214;color:#e4e8e5}*{box-sizing:border-box}body{margin:0}a{color:#bed1c5}button,input{font:inherit}header{padding:20px 26px;border-bottom:1px solid #3b4245;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{margin:0;font-size:21px}header p{margin:7px 0 0;font-size:12px;color:#969e9c}.tag{border:1px solid #3b4245;padding:7px 10px;font-size:11px;white-space:nowrap}.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 89px)}aside{padding:18px 12px;border-right:1px solid #3b4245;max-height:calc(100vh - 89px);overflow:auto;position:sticky;top:0}#filter{width:100%;padding:10px;background:#1a1e20;border:1px solid #3b4245;color:#e4e8e5;font-size:12px}.group{margin:20px 8px 8px;color:#969e9c;font-size:11px}.nav{width:100%;text-align:left;color:#bdc4c0;background:transparent;border:1px solid transparent;border-left:3px solid transparent;padding:10px 8px;cursor:pointer;font-size:12px;margin:1px 0}.nav:hover{background:#252b2f}.nav[aria-current=true]{border-color:#3b4245;border-left-color:#a8bdb1;background:#252b2f;color:#e4e8e5}.nav span{color:#7c8a82;display:inline-block;width:24px}main{padding:22px 28px}.title{display:flex;align-items:center;justify-content:space-between;gap:16px}h2{font-size:22px;margin:0}.actions{display:flex;gap:8px}button.action,.actions a{background:#252b2f;color:#e4e8e5;border:1px solid #3b4245;padding:9px 12px;text-decoration:none;cursor:pointer;font-size:12px}#note{font-size:13px;color:#b0bbb5;line-height:1.8;margin:12px 0 18px;max-width:980px}.stage{border:1px solid #3b4245;background:#090c0b;min-height:180px}.stage img{display:block;width:100%;height:auto;cursor:zoom-in}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:17px 0;font-size:11px;color:#969e9c}.swatch{display:inline-block;width:13px;height:13px;vertical-align:-2px;border:1px solid #67716b;margin-right:5px}.rules{border-top:1px solid #3b4245;margin-top:20px;padding-top:15px;font-size:12px;line-height:1.8;color:#969e9c}.rules strong{color:#d8dfda}.rules p{margin:6px 0}dialog{padding:0;border:1px solid #596660;max-width:96vw;max-height:96vh;background:#101214}dialog::backdrop{background:#000d}dialog img{display:block;max-width:94vw;max-height:88vh;object-fit:contain}dialog button{display:block;margin:8px 12px 8px auto}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a8bdb1;outline-offset:2px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;max-height:240px;border-right:0;border-bottom:1px solid #3b4245}main{padding:18px 12px}header{padding:16px}.title{align-items:flex-start}.actions{flex-direction:column}h2{font-size:18px}}
</style></head><body>
<header><div><h1>行商听音助手 · 界面设计册</h1><p>GPT Image / 23 个页面与状态 / 游戏风格视觉参考</p></div><span class="tag">开发参考 · 非实机截图</span></header>
<div class="layout"><aside aria-label="页面目录"><input id="filter" placeholder="搜索页面…" aria-label="搜索页面"><nav id="nav"></nav></aside><main>
<div class="title"><h2 id="title"></h2><div class="actions"><button class="action" id="zoom">放大查看</button><a id="original" target="_blank" rel="noopener">打开原图</a></div></div>
<p id="note"></p><div class="stage"><img id="screen" alt=""></div>
<div class="legend"><span><i class="swatch" style="background:#101214"></i>近黑背景</span><span><i class="swatch" style="background:#1a1e20"></i>炭灰面板</span><span><i class="swatch" style="background:#3b4245"></i>细灰边框</span><span><i class="swatch" style="background:#e4e8e5"></i>偏白文字</span><span><i class="swatch" style="background:#a8bdb1"></i>低饱和状态色</span></div>
<div class="rules"><p><strong>统一交互：</strong>保留格数分组与顶部整体占比百分数；候选不分页，优先横向扩展并尽量减少滚动；试听与字号直接可见；固定/解锁使用同一个图钉的亮/暗状态。</p>
<p><strong>开发边界：</strong>图片中的数据、物品插图和状态为示例。实际物品使用已有目录与缩略图。生成图中的个别文字、导航或装饰偏差，以 <a href="README.md">开发说明</a> 为准；“补库 / 学习”是一个入口，图片选择只发生在本地。</p>
<p><a href="design-manifest.json">页面规范与完整提示词</a> · <a href="image-prompts.md">生成方式与图标提示词</a></p></div>
</main></div><dialog id="lightbox"><button class="action" id="dismiss">关闭 · Esc</button><img id="large" alt=""></dialog>
<script>
const pages=[{"id":"01-listening","title":"监听控制","group":"主窗口","file":"screens/01-listening.png","note":"默认关闭状态；启停、历史、试识别和浮窗入口直接可见。状态必须绑定实时控制器。"},{"id":"02-audio","title":"采音与快捷键","group":"主窗口","file":"screens/02-audio.png","note":"播放设备为 WASAPI 系统回环；两个快捷键分别控制监听和浮窗操作。"},{"id":"03-position","title":"浮窗位置","group":"主窗口","file":"screens/03-position.png","note":"优先顶部居中，候选增多时横向扩展；自定义坐标按实际设置模型处理。"},{"id":"04-appearance","title":"浮窗外观","group":"主窗口","file":"screens/04-appearance.png","note":"图片大小与字号独立；字号支持小、中、大；硬件加速重启生效。"},{"id":"05-library","title":"音效库","group":"主窗口","file":"screens/05-library.png","note":"目录数量来自真实库；覆盖清单、图鉴、测试报告沿用现有入口。"},{"id":"06-diagnostics","title":"运行诊断","group":"主窗口","file":"screens/06-diagnostics.png","note":"展示真实输入与采音状态；导出仅含诊断状态和计数。"},{"id":"07-live-comparison","title":"识别 / 对比浮窗 v2","group":"对比与学习","file":"screens/07-live-comparison-v2.png","note":"恢复按格数分组及顶部大金候选占比百分数；示例 50%（3/6 件），按全部候选计算。保留回放、逐卡试听、字号及单图钉；不分页。"},{"id":"08-sound-workspace","title":"声音对比工作区","group":"对比与学习","file":"screens/08-sound-workspace.png","note":"选择已采到的声音和参考音效；操作时暂停采音，试听不会回流识别。"},{"id":"09-candidates","title":"完整候选","group":"对比与学习","file":"screens/09-candidates.png","note":"按格数组织完整候选；图像、格数与品质以真实目录为准，不显示逐物品概率。"},{"id":"10-history","title":"识别历史","group":"对比与学习","file":"screens/10-history.png","note":"本次最近 100 条；左记录、右候选；音频过期仍保留文字结果。"},{"id":"11-learning-start","title":"补库与学习入口","group":"对比与学习","file":"screens/11-learning-start.png","note":"先选择真实物品，再补样本；新物品录入和继续草稿有明确入口。"},{"id":"12-learning-draft","title":"学习草稿与样本","group":"对比与学习","file":"screens/12-learning-draft.png","note":"参考和单独试识别分开；试听、裁剪、导入与检查启用完整保留。"},{"id":"13-new-item-name","title":"录入新物品 · 名称与分类","group":"录入与个人库","file":"screens/13-new-item-name.png","note":"第一步只有名称与分类；图中额外游戏示意不作为功能开发范围。"},{"id":"14-new-item-details","title":"录入新物品 · 格数与图片","group":"录入与个人库","file":"screens/14-new-item-details.png","note":"格数宽高、可选图片和参考价；图片从本地选择，不存在网络上传。"},{"id":"15-trim","title":"样本裁剪","group":"录入与个人库","file":"screens/15-trim.png","note":"数字起止时间裁剪；试听选段、独立试识别标记、保存样本。"},{"id":"16-personal-library","title":"个人音效库","group":"录入与个人库","file":"screens/16-personal-library.png","note":"物品与样本管理、草稿、回退、aqtwlib 导入导出；与基础库隔离。"},{"id":"17-personal-items","title":"个人库 · 物品管理","group":"录入与个人库","file":"screens/17-personal-items.png","note":"启停物品、删除及补充样本；样例名称只用于设计。"},{"id":"18-personal-samples","title":"个人库 · 样本管理","group":"录入与个人库","file":"screens/18-personal-samples.png","note":"参考与试识别样本明确区分；提供试听和启停。"},{"id":"19-catalog","title":"物品缩略图鉴","group":"工具与状态","file":"screens/19-catalog.png","note":"全目录浏览，与本次识别无关；使用项目原有真实缩略图。"},{"id":"20-sound-conflict","title":"同音关系确认","group":"工具与状态","file":"screens/20-sound-conflict.png","note":"先试听再确认同音关系；确认前保持原库。"},{"id":"21-drafts","title":"本地学习草稿","group":"工具与状态","file":"screens/21-drafts.png","note":"继续或删除本地未完成草稿，不设置分页。"},{"id":"22-guided-capture","title":"引导采样状态","group":"工具与状态","file":"screens/22-guided-capture.png","note":"三次参考加一次独立试识别；准备和采音时序、暂停状态清楚可见。"},{"id":"23-offline-result","title":"离线音频识别结果","group":"工具与状态","file":"screens/23-offline-result.png","note":"离线 WAV 的识别结果；比例是候选占比，不是出货概率。"}];const nav=document.getElementById('nav'),filter=document.getElementById('filter'),screen=document.getElementById('screen'),dialog=document.getElementById('lightbox');let active=pages[0];
function list(){nav.replaceChildren();let group='';for(const p of pages.filter(p=>(p.title+p.group+p.id).toLowerCase().includes(filter.value.toLowerCase()))){if(group!==p.group){const label=document.createElement('div');label.className='group';label.textContent=group=p.group;nav.append(label)}const b=document.createElement('button');b.className='nav';b.setAttribute('aria-current',p.id===active.id?'true':'false');const n=document.createElement('span');n.textContent=p.id.slice(0,2);b.append(n,document.createTextNode(p.title));b.onclick=()=>select(p.id);nav.append(b)}}
function select(id){active=pages.find(p=>p.id===id)||pages[0];document.getElementById('title').textContent=active.id.slice(0,2)+' / '+active.title;document.getElementById('note').textContent=active.note;screen.src=active.file;screen.alt=active.title+'设计图';document.getElementById('original').href=active.file;history.replaceState(null,'','#'+active.id);list()}
function zoom(){document.getElementById('large').src=active.file;document.getElementById('large').alt=screen.alt;dialog.showModal()}filter.oninput=list;document.getElementById('zoom').onclick=zoom;screen.onclick=zoom;document.getElementById('dismiss').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};window.onhashchange=()=>select(location.hash.slice(1));select(location.hash.slice(1));
</script></body></html>
